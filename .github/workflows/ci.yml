name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race detector
        run: go test -race ./... -count=1
      - name: Static checks
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Redis and PostgreSQL integration
        run: make integration-test
      - name: Stop test dependencies
        if: always()
        run: make test-down
