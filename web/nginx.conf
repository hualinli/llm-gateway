# ---------------------------------------------------------------------------
# LLM Gateway Console — production nginx example (task T04)
#
# Topology (same origin, no CORS, no token in JavaScript-readable storage):
#
#   browser ──▶ nginx ──┬─ /                static build of web/dist (SPA)
#                       ├─ /api/v1/…        Console  (control plane, cookies)
#                       └─ /v1/…            Gateway  (data plane, SSE)
#
# The session cookie (`gw_session`, HttpOnly, SameSite=Lax, Path=/) and its CSRF
# companion are set by the Console on this origin, so everything must stay
# same-origin: do not split /api/v1 onto a second hostname.
#
# Build and publish:
#   cd web && npm ci && npm run build
#   sudo rsync -a --delete web/dist/ /var/www/llm-gateway-console/
#   sudo nginx -t && sudo nginx -s reload
#
# Adjust: server_name, root, TLS (listen 443 ssl + certbot), upstream ports.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Static assets only. SSE must never be compressed (see the /v1/ location).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Console returns 64-bit ids as strings; keep bodies modest.
    client_max_body_size 1m;

    upstream console_api {
        server 127.0.0.1:8092;
        keepalive 32;
    }

    upstream gateway_api {
        server 127.0.0.1:8090;
        keepalive 32;
    }

    # Long-lived SSE connections need a generous read timeout; the request body
    # and header timeouts stay short because only small JSON bodies are posted.
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    server {
        listen      80;
        listen      [::]:80;
        server_name console.example.com;

        root  /var/www/llm-gateway-console;
        index index.html;

        # NOTE nginx `add_header` inheritance: a location that declares its own
        # add_header drops every inherited one. This example therefore keeps all
        # add_header directives here at server level and never inside a
        # location, so the security headers apply to the proxied APIs too.
        add_header X-Content-Type-Options nosniff      always;
        add_header X-Frame-Options        DENY         always;
        add_header Referrer-Policy        no-referrer  always;
        # antd injects its CSS at runtime (cssinjs), hence 'unsafe-inline' for
        # styles; scripts stay same-origin only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ---- control plane: session cookie + CSRF -------------------------
        location /api/v1/ {
            proxy_pass http://console_api;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Session/CSRF responses are per-user: keep buffering off and let
            # the Console's own headers reach the browser unchanged.
            proxy_buffering off;
        }

        location = /livez  { proxy_pass http://console_api/livez;  access_log off; }
        location = /readyz { proxy_pass http://console_api/readyz; access_log off; }

        # ---- data plane: OpenAI-compatible /v1, streaming -----------------
        location /v1/ {
            proxy_pass http://gateway_api;

            # SSE without buffering: no nginx buffering, no caching, no gzip,
            # chunked transfer to the browser, and no read timeout between
            # tokens. `X-Accel-Buffering: no` also covers nested proxies.
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_cache             off;
            gzip                    off;
            chunked_transfer_encoding on;
            proxy_set_header        X-Accel-Buffering no;

            proxy_connect_timeout 5s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
        }

        # ---- static SPA ---------------------------------------------------
        # Hashed assets are immutable; index.html must always be revalidated so
        # a deployment is picked up immediately.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
