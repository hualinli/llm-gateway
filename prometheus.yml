global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8090"]
    scrape_interval: 2s
    scrape_timeout: 1s

  - job_name: "metering"
    metrics_path: /metrics
    static_configs:
      - targets: ["metering:8091"]
    scrape_interval: 2s
    scrape_timeout: 1s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
