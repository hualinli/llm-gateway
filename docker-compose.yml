services:
  migrate:
    build:
      context: .
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control:
    build:
      context: .
    entrypoint: ["/usr/local/bin/control"]
    environment:
      # 本地 Demo 显式声明 demo profile；生产必须满足
      # docs/decisions.md 中列出的全部检查，缺失即拒绝启动。
      GATEWAY_PROFILE: demo
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
      CONTROL_REQUIRE_POSTGRES: "true"
      CONTROL_REQUIRE_ADMIN_AUTH: "true"
      CONTROL_ADMIN_TOKEN: ${CONTROL_ADMIN_TOKEN:-demo-control-token}
      PROVIDER_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/provider-credential-master-key
      CONTROL_ALLOW_INSECURE_CREDENTIAL_RESOLVE: "true"
      # T03：Console -> Control 管理面（AdminService）。demo 显式放开 mTLS 并要求
      # 客户端声称的身份是 console；生产必须改为
      # CONTROL_TLS_REQUIRE_CLIENT_CERT=true + CONTROL_TLS_CA_FILE，并撤销
      # CONTROL_ALLOW_INSECURE_ADMIN_SERVICE（见 README「Console -> Control 管理通道」）。
      CONTROL_ADMIN_SERVICE_ENABLED: "true"
      CONTROL_CONSOLE_SERVICE_NAME: console
      CONTROL_ALLOW_INSECURE_ADMIN_SERVICE: "true"
    ports:
      # The insecure credential resolver is reachable from the host only for local demo work.
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:50052:50052"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:50052/healthz"]
      interval: 2s
      timeout: 1s
      retries: 30
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data/provider-credential-master-key:/run/secrets/provider-credential-master-key:ro

  metering:
    build:
      context: .
    entrypoint: ["/usr/local/bin/metering"]
    environment:
      # demo profile：/ledger/* 与 /reconcile 无 token 时保持开放并打印警告；
      # 生产见 docs/decisions.md。
      GATEWAY_PROFILE: demo
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
      METERING_REQUIRE_POSTGRES: "true"
      # Read-only policy credential; it grants no recovery or money-operation permission.
      METERING_POLICY_TOKEN: ${METERING_POLICY_TOKEN:-demo-policy-read-token}
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - metering-spool:/var/lib/llm-gateway/metering-spool
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/readyz"]
      interval: 2s
      timeout: 1s
      retries: 30

  console:
    build:
      context: .
    entrypoint: ["/usr/local/bin/console"]
    environment:
      # demo profile：Secure cookie 关闭（本机 http 调试）、诊断与业务同端口，
      # 未满足的生产检查只打印 WARNING；生产见
      # docs/decisions.md。
      GATEWAY_PROFILE: demo
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
      CONSOLE_SECURE_COOKIES: "false"
      # T03：Key 管理与策略发布都经 Control AdminService；同一 compose 网络内 demo
      # 使用明文通道（Control 侧已显式 CONTROL_ALLOW_INSECURE_ADMIN_SERVICE）。
      # 生产：设置 CONTROL_TLS_CA_FILE + CONTROL_TLS_CLIENT_CERT_FILE/KEY
      # （scripts/dev-certs.sh 生成 console-client.*）与 CONTROL_TLS_SERVER_NAME。
      CONTROL_ADDR: control:50051
      CONTROL_CONSOLE_SERVICE_NAME: console
      CONSOLE_PUBLICATION_INTERVAL: 15s
      CONSOLE_METERING_URL: http://metering:8091
      CONSOLE_METERING_POLICY_TOKEN: ${METERING_POLICY_TOKEN:-demo-policy-read-token}
    ports:
      # Console 业务 listener：/api/v1/* 与 /livez、/readyz；仅本机可达。
      - "127.0.0.1:8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/readyz"]
      interval: 2s
      timeout: 1s
      retries: 30

  gateway:
    build:
      context: .
    entrypoint: ["/usr/local/bin/gateway"]
    environment:
      # demo profile 保留宽松默认（内存 key store、诊断与业务同端口）；
      # 生产见 docs/decisions.md。
      GATEWAY_PROFILE: demo
      REDIS_ADDR: redis:6379
      CONTROL_ADDR: control:50051
      LIMITER_ON_REDIS_ERROR: closed
      GATEWAY_MAX_ACTIVE_STREAMS: "256"
      # 数据面 PG access guard（ADR-0003 §2.8）：demo 的 key 来自 legacy
      # bootstrap/raw-key 路径，没有 org 归属，access guard 开启后这些 key 会被
      # 401 拒绝，所以 demo 显式关闭（进程会打印 WARNING）。要验证企业 RBAC
      # 数据面时改成 pg 并取消下面 POSTGRES_DSN 的注释；生产 profile 强制 pg。
      GATEWAY_ACCESS_GUARD: "off"
      # POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
      # 计费准入与 durable receipt（T06C）：默认 off。demo 的 key/账户/价目数据由
      # Console 写入，没有企业归属的 legacy key 会被准入拒绝（503），所以 demo 显式
      # 关闭并由进程打印 WARNING：既不预占资金，也不在 [DONE] 前写 usage receipt。
      # 要验证资金闭环时改成 pg，并同时把上面的 GATEWAY_ACCESS_GUARD 改成 pg、
      # 取消 POSTGRES_DSN 注释（准入需要已验证的 org/user/key 归属）。
      GATEWAY_BILLING: "off"
      METERING_SPOOL_DIR: /var/lib/llm-gateway/metering-spool
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - metering-spool:/var/lib/llm-gateway/metering-spool
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # A provider-less Gateway is intentionally live but not ready. Provider
      # configuration is submitted explicitly after external mocks start.
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/livez"]
      interval: 2s
      timeout: 1s
      retries: 30

  # T09 second data-plane instance. It is behind a profile so the daily demo is
  # unchanged, and it deliberately shares Control/Redis/PostgreSQL with the
  # `gateway` service: that is the topology T09 is about.
  #
  # What is shared: identity and config (Control snapshot), the organization RPM
  # token bucket (Redis), the wallet and the usage receipts (PostgreSQL).
  # What is NOT shared: active-stream caps. GATEWAY_MAX_ACTIVE_STREAMS and
  # GATEWAY_MAX_ACTIVE_STREAMS_PER_ORG are per instance, so running this service
  # doubles an organization's reachable ceiling. They are not a cross-instance
  # hard quota (roadmap §4.3) and must never be reported as one.
  #
  #   docker compose --profile multi-instance up -d --build --wait
  gateway-b:
    profiles: ["multi-instance"]
    build:
      context: .
    entrypoint: ["/usr/local/bin/gateway"]
    environment:
      GATEWAY_PROFILE: demo
      GATEWAY_INSTANCE_ID: gateway-b
      GATEWAY_ADDR: ":8093"
      # 与 gateway 服务不同，这里直接按生产形态把诊断 listener 分出来。
      GATEWAY_DIAGNOSTICS_ADDR: ":8094"
      REDIS_ADDR: redis:6379
      CONTROL_ADDR: control:50051
      LIMITER_ON_REDIS_ERROR: closed
      GATEWAY_MAX_ACTIVE_STREAMS: "256"
      GATEWAY_MAX_ACTIVE_STREAMS_PER_ORG: "32"
      GATEWAY_ACCESS_GUARD: "off"
      GATEWAY_BILLING: "off"
      METERING_SPOOL_DIR: /var/lib/llm-gateway/metering-spool-b
    ports:
      - "127.0.0.1:8093:8093"
      - "127.0.0.1:8094:8094"
    volumes:
      - metering-spool-b:/var/lib/llm-gateway/metering-spool-b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /livez lives on the business listener (the diagnostics listener only
      # serves /metrics and /debug/pprof), exactly like the first gateway.
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/livez"]
      interval: 2s
      timeout: 1s
      retries: 30

  mock-primary:
    profiles: ["demo-mocks"]
    build:
      context: .
    entrypoint: ["/usr/local/bin/upstream-mock"]
    command: ["-listen", ":18080", "-name", "primary", "-ttft", "20ms", "-token-interval", "15ms"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18080/healthz"]
      interval: 1s
      timeout: 1s
      retries: 20

  mock-backup:
    profiles: ["demo-mocks"]
    build:
      context: .
    entrypoint: ["/usr/local/bin/upstream-mock"]
    command: ["-listen", ":18081", "-name", "backup", "-ttft", "80ms", "-token-interval", "15ms"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18081/healthz"]
      interval: 1s
      timeout: 1s
      retries: 20

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      gateway:
        condition: service_healthy
      metering:
        condition: service_healthy

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=llm_gateway
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=gateway
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d llm_gateway"]
      interval: 2s
      timeout: 1s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

volumes:
  redis-data:
  grafana-data:
  pg-data:
  metering-spool:
  # T09: the second instance keeps its own spool so a spool failure in one
  # process cannot be mistaken for the other's.
  metering-spool-b:
