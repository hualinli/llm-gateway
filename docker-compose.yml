services:
  migrate:
    build:
      context: .
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control:
    build:
      context: .
    entrypoint: ["/usr/local/bin/control"]
    environment:
      # 本地 Demo 显式声明 demo profile；生产必须满足
      # docs/decisions/ADR-0001-runtime-profiles.md 中列出的全部检查，缺失即拒绝启动。
      GATEWAY_PROFILE: demo
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
      CONTROL_REQUIRE_POSTGRES: "true"
      CONTROL_REQUIRE_ADMIN_AUTH: "true"
      CONTROL_ADMIN_TOKEN: ${CONTROL_ADMIN_TOKEN:-demo-control-token}
      PROVIDER_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/provider-credential-master-key
      CONTROL_ALLOW_INSECURE_CREDENTIAL_RESOLVE: "true"
    ports:
      # The insecure credential resolver is reachable from the host only for local demo work.
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:50052:50052"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:50052/healthz"]
      interval: 2s
      timeout: 1s
      retries: 30
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data/provider-credential-master-key:/run/secrets/provider-credential-master-key:ro

  metering:
    build:
      context: .
    entrypoint: ["/usr/local/bin/metering"]
    environment:
      # demo profile：/ledger/* 与 /reconcile 无 token 时保持开放并打印警告；
      # 生产见 docs/decisions/ADR-0001-runtime-profiles.md。
      GATEWAY_PROFILE: demo
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
      METERING_REQUIRE_POSTGRES: "true"
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - metering-spool:/var/lib/llm-gateway/metering-spool
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/readyz"]
      interval: 2s
      timeout: 1s
      retries: 30

  console:
    build:
      context: .
    entrypoint: ["/usr/local/bin/console"]
    environment:
      # demo profile：Secure cookie 关闭（本机 http 调试）、诊断与业务同端口，
      # 未满足的生产检查只打印 WARNING；生产见
      # docs/decisions/ADR-0002-iam-identity-and-organizations.md §5。
      GATEWAY_PROFILE: demo
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/llm_gateway?sslmode=disable
      CONSOLE_SECURE_COOKIES: "false"
    ports:
      # Console 业务 listener：/api/v1/* 与 /livez、/readyz；仅本机可达。
      - "127.0.0.1:8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/readyz"]
      interval: 2s
      timeout: 1s
      retries: 30

  gateway:
    build:
      context: .
    entrypoint: ["/usr/local/bin/gateway"]
    environment:
      # demo profile 保留宽松默认（内存 key store、诊断与业务同端口）；
      # 生产见 docs/decisions/ADR-0001-runtime-profiles.md。
      GATEWAY_PROFILE: demo
      REDIS_ADDR: redis:6379
      CONTROL_ADDR: control:50051
      LIMITER_ON_REDIS_ERROR: closed
      GATEWAY_MAX_ACTIVE_STREAMS: "256"
      METERING_SPOOL_DIR: /var/lib/llm-gateway/metering-spool
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - metering-spool:/var/lib/llm-gateway/metering-spool
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # A provider-less Gateway is intentionally live but not ready. Provider
      # configuration is submitted explicitly after external mocks start.
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/livez"]
      interval: 2s
      timeout: 1s
      retries: 30

  mock-primary:
    profiles: ["demo-mocks"]
    build:
      context: .
    entrypoint: ["/usr/local/bin/upstream-mock"]
    command: ["-listen", ":18080", "-name", "primary", "-ttft", "20ms", "-token-interval", "15ms"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18080/healthz"]
      interval: 1s
      timeout: 1s
      retries: 20

  mock-backup:
    profiles: ["demo-mocks"]
    build:
      context: .
    entrypoint: ["/usr/local/bin/upstream-mock"]
    command: ["-listen", ":18081", "-name", "backup", "-ttft", "80ms", "-token-interval", "15ms"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18081/healthz"]
      interval: 1s
      timeout: 1s
      retries: 20

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      gateway:
        condition: service_healthy
      metering:
        condition: service_healthy

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=llm_gateway
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=gateway
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d llm_gateway"]
      interval: 2s
      timeout: 1s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

volumes:
  redis-data:
  grafana-data:
  pg-data:
  metering-spool:
