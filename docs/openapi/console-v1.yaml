      type: object
      required: [model, input_price_micro_per_million, output_price_micro_per_million, effective_at]
      properties:
        model: { type: string }
        currency: { type: string, enum: [CNY] }
        input_price_micro_per_million: { type: string }
        output_price_micro_per_million: { type: string }
        provider_input_cost_micro_per_million: { type: [string, 'null'] }
        provider_output_cost_micro_per_million: { type: [string, 'null'] }
        effective_at: { type: string, format: date-time }
