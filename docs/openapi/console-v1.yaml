      type: object
      required: [amount_micro, type, reason]
      properties:
        amount_micro: { type: string, pattern: '^[1-9]\d*$' }
        type: { type: string, enum: [recharge, reversal] }
        reason: { type: string }
        payment_reference: { type: string }
        reverse_of: { type: string, description: Original recharge ledger entry id; reversal amount must match }
      allOf:
        - if: { required: [type], properties: { type: { const: recharge } } }
          then: { required: [payment_reference] }
        - if: { required: [type], properties: { type: { const: reversal } } }
          then: { required: [reverse_of] }
