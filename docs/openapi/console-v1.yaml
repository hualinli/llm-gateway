openapi: 3.1.0
info:
  title: LLM Gateway Console API
  version: "1.0.0"
  description: |
    Console (control-plane IAM) HTTP API: T02 (users, sessions, organizations)
    plus the T03 organization surface (members, invitations, ownership transfer,
    audit, API keys, usage).

    This document is the frozen contract of ADR-0002 §4 and ADR-0003 §2.3–§2.6
    and describes **only** the endpoints implemented by `internal/console` and
    served by `cmd/console`. There is no self-service registration, no email
    delivery, no OIDC/SSO/MFA and no password recovery in this version. An
    invitation is a link that an administrator copies; its email is **not**
    verified by delivery.

    Cross-cutting rules:

    * All request and response bodies are JSON (`Content-Type: application/json`).
    * Every 64-bit identifier is transported as a JSON **string** so no client
      loses precision (RFC 8259 numbers are doubles in most runtimes).
    * Every timestamp is RFC 3339 in UTC (`2026-10-01T12:00:00Z`).
    * Every error response uses the shared envelope below, including the
      correlation id echoed from `X-Request-ID`.
    * List endpoints return `{"items": [...], "next_cursor": <string|null>}`.
      `limit` defaults to 20 and is clamped to 100. Cursors are opaque decimal
      id strings; `null` means "no further page".
    * `/livez` and `/readyz` are the only unauthenticated, non-JSON endpoints.

    Authentication is a browser session cookie (`gw_session`). The session token
    is opaque, stored server-side only as a SHA-256 hash, and is revoked on
    logout and when the user is disabled. Any state-changing request
    (`POST`/`PATCH`/`DELETE`) must additionally present the session-bound CSRF
    token in `X-CSRF-Token`; `SameSite` does not replace it.

    Authorization is the ADR-0003 §2.3 permission matrix, enforced **only** in
    the service layer (`internal/organization`) with the acting membership read
    in the same transaction:

    | action | member | billing_viewer | admin | owner |
    |---|---|---|---|---|
    | use_model / manage_own_keys / view_own_usage | ✓ | — | ✓ | ✓ |
    | view_org_usage | — | ✓ | ✓ | ✓ |
    | manage_members / change_member_policy | — | — | ✓ | ✓ |
    | create_admin / transfer_owner | — | — | — | ✓ |

    Roles never stack, `platform_admin` is a user-level flag and never an
    organization role, and every organization-scoped route answers `404` for a
    non-member so organization existence never leaks.

    API keys (T03, ADR-0003 §2.2/§2.9): the Console owns no key state. Every key
    command is submitted to the internal Control `AdminService` over gRPC/mTLS,
    which owns the `api_keys` fact table and the versioned snapshot. The raw
    secret is returned **exactly once**, by `POST /api/v1/orgs/{org}/keys`; it is
    never stored, never audited and never logged, and no endpoint can recover it.
    When that response is lost, read the key metadata back with
    `GET /api/v1/orgs/{org}/keys?operation_id=...` (`replayed: true`, no secret)
    or revoke the orphan key and create a new one.

    Usage (T03, ADR-0003 §2.9) is read from `metering_events` in one organization
    scope: a plain `member` sees only rows attributed to their own user id, while
    `billing_viewer`, `admin` and `owner` see the whole organization. The legacy
    cost column is accumulated **demo consumption**, never a balance, and the API
    says so in `totals.cost_kind`/`cost_note`.

    Control-channel failures are reported as `502 upstream_unavailable` (the
    Console could not authenticate to or reach Control: the browser cannot fix
    that) and `503 unavailable` (no control channel is configured at all).
  license:
    name: UNLICENSED
servers:
  - url: http://127.0.0.1:8092
    description: Local demo / development (CONSOLE_ADDR default)
tags:
  - name: auth
    description: Browser session lifecycle
  - name: me
    description: Current identity
  - name: organizations
    description: Organizations the caller can see
  - name: members
    description: Organization members and their roles (T03)
  - name: invitations
    description: Single-use invitation links (T03)
  - name: audit
    description: Organization audit trail (T03)
  - name: keys
    description: Organization API keys, issued by the Control AdminService (T03)
  - name: usage
    description: Metering usage in an organization scope (T03)
  - name: prices
    description: Immutable model price versions, platform-administrator only (T05, ADR-0004)
  - name: billing
    description: |
      Organization billing account and append-only ledger (T05, ADR-0004).
      Every amount is a decimal string of integer micro-yuan (10^-6 CNY).
  - name: admin
    description: Platform-administrator-only user management
  - name: probes
    description: Liveness and readiness on the business listener

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange email and password for a session
      description: |
        On success the response sets two HttpOnly, `SameSite=Lax`, `Path=/`
        cookies: `gw_session` (the opaque session token) and `gw_csrf` (the CSRF
        token companion, never readable from JavaScript). The same CSRF token is
        returned in the body so a client can immediately issue unsafe requests.

        The response is independent of whether the email exists: wrong password
        and unknown email both produce `401 unauthorized`. Repeated failures are
        throttled per `email + client IP` and produce `429 rate_limited` with
        `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value: { email: admin@example.com, password: correct-horse-battery-staple }
      responses:
        '200':
          description: Authenticated; session and CSRF cookies are set.
          headers:
            Set-Cookie:
              description: |
                `gw_session=<token>; Path=/; HttpOnly; SameSite=Lax` plus
                `Secure` when `CONSOLE_SECURE_COOKIES` is enabled (mandatory in
                prod). `gw_csrf` is set with the same attributes.
              schema:
                type: array
                items: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      description: |
        Revocation is a server-side fact: the session row is marked revoked and
        both cookies are expired. Replaying the previous `gw_session` value
        afterwards produces `401`. Requires a session and a valid CSRF token.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked; no body.
          headers:
            Set-Cookie:
              description: Both cookies are expired (`Max-Age=0`).
              schema:
                type: array
                items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user, visible organizations and the session CSRF token
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: List the organizations the caller is an active member of
      description: |
        Ordered by organization `id ASC`. `next_cursor` is the last id of the
        page, or `null` when there is no further page. Organizations the caller
        cannot see are never listed.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an enterprise organization
      description: |
        The caller becomes `owner` of the new organization in the same
        transaction. Requires a session and a valid CSRF token.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
            examples:
              default:
                value: { name: acme }
      responses:
        '201':
          description: Organization created; the caller is its owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/organizations/{org}:
    get:
      tags: [organizations]
      operationId: getOrganization
      summary: Read one organization the caller belongs to
      description: |
        A caller who is not an active member receives `404 not_found`, never
        `403`: organization existence is not disclosed (ADR-0002 §2.2).
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: Membership of the caller in that organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/admin/users:
    post:
      tags: [admin]
      operationId: createUser
      summary: Create a controlled user (platform administrators only)
      description: |
        Restricted to callers whose `platform_admin` flag is set; anyone else
        receives `403 forbidden`. Requires a valid CSRF token. The action is
        audited (actor, target, outcome, request/trace id — never the password).

        The optional `organizations` field adds the new user as a `member` of the
        listed organizations. The acting administrator must be able to see each
        of them; an id they are not a member of produces `404 not_found` and the
        user is not created.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              default:
                value:
                  email: member@example.com
                  password: correct-horse-battery-staple
                  platform_admin: false
                  organizations: ["2"]
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/admin/users/{user}/status:
    post:
      tags: [admin]
      operationId: setUserStatus
      summary: Activate or disable a user (platform administrators only)
      description: |
        Disabling bumps the user's `auth_version`, so every existing session of
        that user fails its next resolution with `401`. Re-activating does not
        restore old sessions. Requires a valid CSRF token and is audited.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserStatusRequest'
            examples:
              disable:
                value: { status: disabled }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/orgs/{org}/members:
    get:
      tags: [members]
      operationId: listOrgMembers
      summary: List organization members
      description: |
        Visibility follows the permission matrix: `owner` and `admin`
        (`manage_members`) and the read-only `billing_viewer` (`view_org_usage`)
        see the whole organization; a plain `member` receives a single-element
        list containing only themselves (they can confirm their own role but
        cannot enumerate colleagues). A non-member receives `404 not_found`,
        never `403`, so organization existence is not disclosed.

        Member lists are not paginated in this version: `next_cursor` is always
        `null` and the array shape is the frozen list shape.
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: One page of active members, ordered by user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/orgs/{org}/members/{user}:
    patch:
      tags: [members]
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        Requires `manage_members` (admin/owner) and a valid CSRF token. Roles
        never stack and there is no role inheritance.

        Refusals:

        * an `admin` acting on an `owner` or another `admin` → `403 forbidden`;
        * granting `owner` (any actor) → `403 forbidden`: ownership is only
          granted by `POST /api/v1/orgs/{org}/owner-transfer`;
        * granting `admin` requires `create_admin`, which only an `owner` has →
          otherwise `403 forbidden`;
        * granting `platform_admin` → `403 forbidden` (it is not an
          organization role);
        * demoting the last remaining `owner`, including self-demotion →
          `409 conflict`;
        * an unknown target member → `404 not_found`;
        * a non-member caller, or an unknown organization → `404 not_found`;
        * a role outside the vocabulary → `400 invalid_request`.

        A successful change bumps the organization's `org_revision` and writes a
        `pending` policy publication **in the same transaction**, which is what
        lets the data plane revoke affected keys later.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
            examples:
              promoteToAdmin:
                value: { role: admin }
      responses:
        '204':
          description: Role changed; no body. Audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [members]
      operationId: removeMember
      summary: Remove a member from the organization
      description: |
        Requires `manage_members` and a valid CSRF token. Removal is a soft
        delete (`memberships.status = 'removed'`) and bumps `org_revision` with a
        `pending` policy publication in the same transaction.

        An `admin` cannot remove an `owner` or another `admin` (`403`); the last
        remaining `owner` cannot leave or be removed (`409 conflict`); an unknown
        or already-removed member is `404 not_found`; a non-member caller gets
        `404 not_found`.

        Note: the data plane (Gateway) enforcement of the resulting key
        revocation is a follow-up task; this endpoint only records the revision
        and publication.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Member removed; no body. Audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/orgs/{org}/invitations:
    get:
      tags: [invitations]
      operationId: listOrgInvitations
      summary: List invitation metadata
      description: |
        Requires `manage_members` (admin/owner). Returns metadata only: the raw
        token is returned exactly once by the create call, and the server stores
        only its SHA-256. Non-members receive `404 not_found`; members without
        the permission receive `403 forbidden`.

        Newest first (id `DESC`); at most the 200 most recent invitations are
        returned and `next_cursor` is always `null`.
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: Invitations of the organization, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Create a single-use invitation link
      description: |
        Requires `manage_members` and a valid CSRF token. The response contains
        the raw `token` **exactly once**; only its SHA-256 hash is stored, so a
        lost token must be re-issued. The email and role are fixed at creation
        time and can never be overridden when the invitation is accepted. The
        administrator copies the link; no email is sent and the email address is
        therefore not verified by delivery.

        Rules: an `admin` may invite `member`/`billing_viewer`, only an `owner`
        may invite an `admin` or an `owner`, and `platform_admin` can never be
        invited. Creating an invitation does not change any membership, so it
        does not bump `org_revision`.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
            examples:
              default:
                value: { email: invitee@example.com, role: member }
      responses:
        '201':
          description: Invitation created; the raw token is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/invitations/{token}/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Requires a session (the accepting identity) and a valid CSRF token: the
        call creates a membership. No organization membership is required — the
        token plus the invitation's fixed email are the authorization.

        In one transaction the invitation row is locked, the status/expiry/email
        are checked, the membership is created or reactivated with the
        invitation's role, the invitation is marked accepted, `org_revision` is
        bumped and a `pending` policy publication is written.

        Refusals: unknown or tampered token → `404 not_found`; the logged-in
        email does not match the invited email → `403 forbidden`; already
        accepted, revoked or expired → `409 conflict`.
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Membership created or reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/orgs/{org}/owner-transfer:
    post:
      tags: [members]
      operationId: transferOwnership
      summary: Transfer ownership to another member
      description: |
        The only path that grants `owner` (requires `transfer_owner`, i.e. the
        caller must be an `owner`, plus a valid CSRF token). In one serialized
        transaction the target is promoted to `owner` and the caller becomes
        `admin`, so the organization always keeps at least one owner. The action
        bumps `org_revision` and writes a `pending` policy publication.

        Refusals: caller is not an owner → `403 forbidden`; target is the caller
        → `400 invalid_request`; target is already an owner → `409 conflict`;
        target is not an active member or the caller is not a member →
        `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerTransferRequest'
            examples:
              default:
                value: { user: "3" }
      responses:
        '200':
          description: Ownership transferred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerTransferResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/orgs/{org}/audit:
    get:
      tags: [audit]
      operationId: listOrgAudit
      summary: Read the organization audit trail
      description: |
        Requires `manage_members`: only `owner` and `admin` may read the audit
        trail of an organization. A member or `billing_viewer` of the
        organization receives `403 forbidden`; a non-member receives
        `404 not_found`.

        Rows are ordered newest first (id `DESC`) and the cursor is the last id
        of the previous page. Every mutation of the T03 surface writes exactly
        one row (success or failure) with actor, organization, action, target,
        outcome and the request/trace correlation ids. Refused probes aimed at an
        organization are attributed to that organization so its administrators
        can see them; they can never be read back by the non-member who made
        them. Passwords, session tokens, CSRF tokens and raw invitation tokens
        are never stored.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of audit events, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/orgs/{org}/keys:
    get:
      tags: [keys]
      operationId: listOrgKeys
      summary: List API key metadata (or recover one operation)
      description: |
        Requires `manage_own_keys` (ADR-0003 §2.3):

        * `member` — only keys whose `owner_user_id` is the caller. The owner
          filter is forced server-side; passing `owner_user_id` for somebody else
          is `403 forbidden`.
        * `admin` / `owner` — every key of the organization; they may narrow the
          list with `owner_user_id`.
        * `billing_viewer` — `403 forbidden` (the role has no key permission).
        * non-member — `404 not_found`.

        **Recovery mode.** With `operation_id`, the endpoint ignores
        `limit`/`cursor`/`owner_user_id` and returns the metadata of the key that
        operation created or revoked, with `replayed: true` and **no secret**:
        Control stores the redacted operation result and deliberately never stores
        the raw key. An unknown operation id, an operation of another
        organization, another user's operation (for a member), or an operation
        that is not about an API key all answer `404 not_found`.

        Keys are sorted by `key_id` ascending and `next_cursor` is Control's
        opaque page token, passed through unchanged.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/KeyCursor'
        - $ref: '#/components/parameters/KeyOwnerFilter'
        - $ref: '#/components/parameters/KeyOperationID'
      responses:
        '200':
          description: One page of key metadata, or the recovered operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyPage' }
              examples:
                page:
                  value:
                    items:
                      - key_id: key_7f3c1a2b
                        prefix: "sk-7f3c1a..."
                        organization_id: "2"
                        owner_user_id: "10"
                        created_by: "10"
                        status: active
                        expires_at: null
                        revoked_at: null
                        model_allowlist: null
                        policy_version: "1"
                        created_at: 2026-10-01T12:00:00Z
                        tenant_id: org:2
                    next_cursor: null
                    replayed: false
                recovered:
                  value:
                    items:
                      - key_id: key_7f3c1a2b
                        prefix: "sk-7f3c1a..."
                        organization_id: "2"
                        owner_user_id: "10"
                        created_by: "10"
                        status: active
                        expires_at: null
                        revoked_at: null
                        model_allowlist: null
                        policy_version: "1"
                        created_at: 2026-10-01T12:00:00Z
                        tenant_id: org:2
                    next_cursor: null
                    replayed: true
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [keys]
      operationId: createOrgKey
      summary: Create an API key and return its secret once
      description: |
        Requires `manage_own_keys` plus the CSRF header (it is a mutation). The
        response is the **only** place a raw API key secret ever appears: it is
        generated inside Control, returned once and stored only as a hash plus a
        prefix. Nothing in the Console logs or persists it.

        Ownership: a `member` always creates a key for themselves (naming another
        `owner_user_id` is `403 forbidden`); `admin`/`owner` may create a key for
        any active member of the organization, and default to themselves when
        `owner_user_id` is omitted. Naming a non-member is `400 invalid_request`.

        Idempotency: the request may carry an `operation_id`. Retrying the same
        create with the same value returns the stored metadata with
        `replayed: true`, `secret_returned_once: false` and **no** `secret` field,
        so a lost response can never create a second key. Reusing an
        `operation_id` with a different payload is `409 conflict`.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKeyRequest' }
            examples:
              ownKey:
                value: {}
              forMember:
                value:
                  owner_user_id: "11"
                  expires_at: 2027-01-01T00:00:00Z
                  model_allowlist: ["gpt-4o", "claude-3-5-sonnet"]
              idempotentRetry:
                value:
                  operation_id: web-create-8f0c1d2e
      responses:
        '201':
          description: |
            The key was created (or the operation was replayed). The `secret`
            field is present exactly once, and `notice` says so in words.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateApiKeyResponse' }
              examples:
                created:
                  value:
                    key:
                      key_id: key_7f3c1a2b
                      prefix: "sk-7f3c1a..."
                      organization_id: "2"
                      owner_user_id: "10"
                      created_by: "10"
                      status: active
                      expires_at: null
                      revoked_at: null
                      model_allowlist: null
                      policy_version: "1"
                      created_at: 2026-10-01T12:00:00Z
                      tenant_id: org:2
                    secret: sk-7f3c1a2b4d5e6f708192a3b4c5d6e7f8
                    secret_returned_once: true
                    replayed: false
                    resulting_version: "12"
                    notice: "Copy this secret now: it is shown only once and can never be retrieved again. If you lose it, revoke this key and create a new one."
                replayed:
                  value:
                    key:
                      key_id: key_7f3c1a2b
                      prefix: "sk-7f3c1a..."
                      organization_id: "2"
                      owner_user_id: "10"
                      created_by: "10"
                      status: active
                      expires_at: null
                      revoked_at: null
                      model_allowlist: null
                      policy_version: "1"
                      created_at: 2026-10-01T12:00:00Z
                      tenant_id: org:2
                    secret_returned_once: false
                    replayed: true
                    resulting_version: "12"
                    notice: "This operation was already applied, so the raw secret is not available again. Read the key metadata with GET /api/v1/orgs/{org}/keys?operation_id=..., or revoke this key and create a new one."
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/orgs/{org}/keys/{key}/revoke:
    post:
      tags: [keys]
      operationId: revokeOrgKey
      summary: Revoke an API key
      description: |
        Requires `manage_own_keys` plus the CSRF header. Revocation is a Control
        command, not a Console write: Control records the operation, writes the
        `api_keys` row and publishes a new snapshot version; the Gateway stops
        resolving the key on its next snapshot (propagation timing is T09's
        lease/heartbeat, this endpoint does not claim instant global revocation).

        A `member` may revoke only their own key: the Console first proves
        ownership against the owner-scoped key list, and anything else is
        `404 not_found`. `admin`/`owner` revoke inside the organization scope, so
        a key of another organization answers `404` as well (Control refuses the
        scope assertion). Revoking an already revoked key is a no-op that returns
        the stored metadata.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The revoked key's metadata (no secret).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeApiKeyResponse' }
              examples:
                revoked:
                  value:
                    key:
                      key_id: key_7f3c1a2b
                      prefix: "sk-7f3c1a..."
                      organization_id: "2"
                      owner_user_id: "10"
                      created_by: "10"
                      status: revoked
                      expires_at: null
                      revoked_at: 2026-10-01T13:00:00Z
                      model_allowlist: null
                      policy_version: "2"
                      created_at: 2026-10-01T12:00:00Z
                      tenant_id: org:2
                    replayed: false
                    resulting_version: "13"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/orgs/{org}/usage:
    get:
      tags: [usage]
      operationId: listOrgUsage
      summary: Read metering usage in an organization scope
      description: |
        Scope is the ADR-0003 §2.3 matrix, resolved server-side:

        * `member` (`view_own_usage`) — only rows with `user_id` = the caller.
          Passing another `user` is `403 forbidden`; the response reports
          `scope: self`.
        * `billing_viewer` (`view_org_usage`, read-only) — the whole
          organization; `scope: organization`.
        * `admin` / `owner` — the whole organization, optionally filtered with
          `user`; `scope: organization`.
        * non-member — `404 not_found`.

        Window: `from`/`to` are RFC 3339; `to` defaults to now and `from` to
        `to - 24h`. The range must be positive and at most 31 days.

        Ordering and paging: `(occurred_at, id) DESC`, i.e. the event's
        `metering_events.created_at` and its stable `event_id`. `next_cursor` is
        an opaque URL-safe token carrying that pair: pass it back as `cursor` for
        the next page. `limit` defaults to 20 and is clamped to 100. `totals`
        always describe the **whole filtered window**, not the returned page.

        Attribution (ADR-0003 §2.8): rows written before the attribution
        migration keep `org_id = NULL` and are therefore invisible in every
        organization scope — they are historical facts of an unknown
        organization, not rows of this one. An organization row whose `user_id`
        is `NULL` (a key created before key-level ownership existed) is visible
        to the organization scope and reported with `attribution:
        legacy_unknown_user` and `user_id: null`. A member never sees it.

        Money: `cost_cents` is a decimal string, and it is the legacy demo price
        (`1 token = 1 cent`) accumulated over the window. It is labelled
        `cost_kind: demo_consumption` and is **not** an account balance and not an
        invoice amount; T05 replaces it with versioned pricing.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
        - $ref: '#/components/parameters/UsageModel'
        - $ref: '#/components/parameters/UsageUser'
        - $ref: '#/components/parameters/UsageKey'
        - $ref: '#/components/parameters/UsageLimit'
        - $ref: '#/components/parameters/UsageCursor'
      responses:
        '200':
          description: One page of usage plus the totals of the filtered window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsagePage' }
              examples:
                self:
                  value:
                    items:
                      - id: evt_01J8Z9
                        occurred_at: 2026-10-01T11:30:00Z
                        organization_id: "2"
                        user_id: "10"
                        key_id: key_7f3c1a2b
                        execution_id: exec_5c1f
                        tenant_id: org:2
                        model: gpt-4o
                        provider: primary
                        prompt_tokens: 120
                        completion_tokens: 340
                        total_tokens: 460
                        cost_cents: "460"
                        attribution: attributed
                    next_cursor: null
                    totals:
                      events: 1
                      prompt_tokens: 120
                      completion_tokens: 340
                      total_tokens: 460
                      cost_cents: "460"
                      cost_kind: demo_consumption
                      cost_note: "cost_cents is accumulated demo consumption at the fixed demo price (1 token = 1 cent). It is not an account balance and not an invoice amount."
                    window:
                      from: 2026-09-30T12:00:00Z
                      to: 2026-10-01T12:00:00Z
                    scope: self
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/admin/prices:
    get:
      tags: [prices]
      operationId: listAdminPrices
      summary: List price versions
      description: |
        Platform administrators only (`403 forbidden` for every other
        authenticated caller, `401 unauthorized` without a session).

        A price version is an immutable row: a model's input and output prices
        from `effective_at` onwards, plus the provider cost when it is known.
        Re-pricing a model publishes a new row; nothing is ever updated in
        place, and the database refuses `UPDATE`/`DELETE` on the table.

        The list is history, not "currently effective": it is ordered by id
        DESC (newest publication first). `model` narrows it to one model's
        versions. Amounts are decimal strings of micro-yuan per one million
        tokens; `provider_*_cost_*` is `null` when the cost is unknown, which is
        not the same as zero.
      parameters:
        - $ref: '#/components/parameters/PriceModelFilter'
        - $ref: '#/components/parameters/BillingLimit'
        - $ref: '#/components/parameters/PriceCursor'
      responses:
        '200':
          description: One page of price versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceVersionPage' }
              examples:
                default:
                  value:
                    items:
                      - id: "12"
                        model: gpt-4o
                        currency: CNY
                        input_price_micro_per_million: "1500000"
                        output_price_micro_per_million: "6000000"
                        provider_input_cost_micro_per_million: "900000"
                        provider_output_cost_micro_per_million: null
                        effective_at: 2026-10-01T00:00:00Z
                        created_by: "1"
                        created_at: 2026-09-30T09:15:00Z
                    next_cursor: "12"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [prices]
      operationId: createAdminPrice
      summary: Publish a new price version
      description: |
        Platform administrators only; requires the session-bound `X-CSRF-Token`
        header.

        The body is the whole price. `effective_at` is part of its identity, so
        publishing the same `(model, effective_at)` twice is `409 conflict`
        rather than an overwrite: an in-flight request must always be able to
        reconstruct the price it was admitted with (T06 pins the version at
        admission). A new `effective_at` is how a price changes.

        All prices are non-negative decimal strings of micro-yuan per one
        million tokens. A JSON number is rejected with `400 invalid_request`:
        the wire format is part of the money contract. `currency` may only be
        `CNY` in this version.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePriceVersionRequest' }
            examples:
              default:
                value:
                  model: gpt-4o
                  currency: CNY
                  input_price_micro_per_million: "1500000"
                  output_price_micro_per_million: "6000000"
                  provider_input_cost_micro_per_million: "900000"
                  provider_output_cost_micro_per_million: null
                  effective_at: 2026-10-01T00:00:00Z
      responses:
        '201':
          description: The price version was published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceVersion' }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/orgs/{org}/billing/account:
    get:
      tags: [billing]
      operationId: getOrgBillingAccount
      summary: Read an organization's billing account
      description: |
        Read scope is the ADR-0003 §2.3 matrix action `view_org_usage`:
        `owner`, `admin` and the read-only `billing_viewer` may read it. A plain
        `member` is `403 forbidden` (they are a member, so the organization's
        existence is not a secret) and a non-member is `404 not_found`.

        `available_micro = posted_balance_micro - reserved_micro` is echoed so a
        client never has to re-derive the number T06's admission compares
        against. `posted_balance_micro` may be negative: that is an explicit
        debt, not a spendable balance, and `reserved_micro` is never negative.

        An organization without a billing account row answers `404 not_found`.
        This endpoint is read-only and never creates the row as a side effect of
        a GET; the row appears when the first posting is applied (a platform
        adjustment now, an admission reservation in T06).
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: The account projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingAccount' }
              examples:
                default:
                  value:
                    organization_id: "2"
                    currency: CNY
                    posted_balance_micro: "12500000"
                    reserved_micro: "2500000"
                    available_micro: "10000000"
                    status: active
                    version: "3"
                    created_at: 2026-10-01T10:00:00Z
                    updated_at: 2026-10-01T11:00:00Z
                    available_note: "available_micro = posted_balance_micro - reserved_micro. A negative available amount is a debt, not a spendable balance."
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/orgs/{org}/billing/entries:
    get:
      tags: [billing]
      operationId: listOrgBillingEntries
      summary: Paged organization ledger
      description: |
        The same `view_org_usage` scope as the account read (`403` for a plain
        member, `404` for a non-member).

        The ledger is append-only: a correction is a new reversing entry, never
        an edit of a past row, so this page is the audit trail of every money
        movement. Ordering is `(posted_at, id) DESC`; `next_cursor` is an opaque
        URL-safe token carrying exactly that pair, and passing it back resumes
        after the last returned row without gaps or duplicates. `limit` defaults
        to 20 and is clamped to 100.

        `kind` filters one movement type. `direction` is the only sign in the
        ledger: `credit` increases the bucket the kind targets, `debit`
        decreases it. An organization with no entries answers an empty page, not
        a 404.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/BillingLimit'
        - $ref: '#/components/parameters/BillingEntriesCursor'
        - $ref: '#/components/parameters/BillingEntryKind'
      responses:
        '200':
          description: One page of ledger entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingEntryPage' }
              examples:
                default:
                  value:
                    items:
                      - id: "42"
                        organization_id: "2"
                        kind: adjustment
                        direction: credit
                        amount_micro: "1500000"
                        business_id: adj-2026-10-01-0001
                        reason: goodwill credit for incident INC-42
                        operator_user_id: "1"
                        request_id: 01J8Z9Q7
                        posted_at: 2026-10-01T12:00:00Z
                        created_at: 2026-10-01T12:00:00Z
                    next_cursor: null
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/billing/accounts/{org}/adjustments:
    post:
      tags: [billing]
      operationId: adjustBillingAccount
      summary: Post a platform credit or debit adjustment
      description: |
        Platform administrators only, on any organization: a platform adjustment
        is not an organization-scoped write, and no organization role (not even
        `owner`) is granted `platform_admin_ops`. The session-bound
        `X-CSRF-Token` header is required as well.

        **Idempotency.** The `Idempotency-Key` header becomes the ledger's
        `business_id`, and `(business_id, kind)` is unique. Replaying the same
        key with the same payload applies the posting exactly once and returns
        the stored entry with `replayed: true` and `200 OK`; reusing the key
        with a different payload (a different amount, direction or reason) is
        `409 conflict` and moves no money.

        **Atomicity and audit.** Locking the account row, inserting the
        append-only entry, updating the projection and writing the
        `console_audit_events` row happen in one PostgreSQL transaction: a
        posting and its audit record commit or roll back together. A debit may
        post a negative balance — that is an explicit receivable, and the T06
        admission path refuses to spend from it; it is never clamped.

        `amount_micro` is a strictly positive decimal string; the sign lives in
        `direction`. `reason` is mandatory: an unexplained money movement is not
        acceptable.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
            examples:
              credit:
                value:
                  amount_micro: "1500000"
                  direction: credit
                  reason: goodwill credit for incident INC-42
              debit:
                value:
                  amount_micro: "250000"
                  direction: debit
                  reason: reversal of duplicate credit adj-2026-10-01-0001
      responses:
        '201':
          description: |
            The posting was applied. `replayed` is `false`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustmentResponse' }
        '200':
          description: |
            The `Idempotency-Key` had already been applied with this exact
            payload; the stored entry is returned and no money moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustmentResponse' }
              examples:
                replayed:
                  value:
                    entry:
                      id: "42"
                      organization_id: "2"
                      kind: adjustment
                      direction: credit
                      amount_micro: "1500000"
                      business_id: adj-2026-10-01-0001
                      reason: goodwill credit for incident INC-42
                      operator_user_id: "1"
                      request_id: 01J8Z9Q7
                      posted_at: 2026-10-01T12:00:00Z
                      created_at: 2026-10-01T12:00:00Z
                    account:
                      organization_id: "2"
                      currency: CNY
                      posted_balance_micro: "12500000"
                      reserved_micro: "0"
                      available_micro: "12500000"
                      status: active
                      version: "2"
                      created_at: 2026-10-01T10:00:00Z
                      updated_at: 2026-10-01T12:00:00Z
                      available_note: "available_micro = posted_balance_micro - reserved_micro. A negative available amount is a debt, not a spendable balance."
                    replayed: true
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /livez:
    get:
      tags: [probes]
      operationId: livez
      summary: Process liveness
      description: Always `200 ok` while the process answers; it never touches PostgreSQL.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            text/plain:
              schema: { type: string }
              examples:
                default: { value: "ok\n" }

  /readyz:
    get:
      tags: [probes]
      operationId: readyz
      summary: Business readiness
      description: |
        `200 ok` when the Console can serve traffic, which means PostgreSQL is
        reachable. `503` with `postgres: <reason>` otherwise. Mounted on the
        business listener, never on the diagnostics listener.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            text/plain:
              schema: { type: string }
              examples:
                default: { value: "ok\n" }
        '503':
          description: A dependency is unavailable.
          content:
            text/plain:
              schema: { type: string }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gw_session
      description: |
        Opaque browser session token issued by `POST /api/v1/auth/login`.
        `HttpOnly`, `SameSite=Lax`, `Path=/`, `Secure` per profile. Invalid,
        expired, revoked and tampered values are all indistinguishable: `401`.
  parameters:
    OrgID:
      name: org
      in: path
      required: true
      description: Organization id as a decimal string.
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
      examples:
        default: { value: "2" }
    UserID:
      name: user
      in: path
      required: true
      description: User id as a decimal string.
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
      examples:
        default: { value: "3" }
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Defaults to 20. Values above 100 are clamped to 100; values
        below 1, or non-numeric values, are rejected with `400 invalid_request`.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Last organization id of the previous page, as a decimal string. Absent
        means the first page.
      schema: { type: string, pattern: '^[0-9]+$' }
    KeyID:
      name: key
      in: path
      required: true
      description: |
        API key id (Control's `api_keys.key_id`, for example `key_7f3c1a2b`). It
        is globally unique, and every request additionally asserts the
        organization scope, so a key of another organization is `404`.
      schema: { type: string, minLength: 1, maxLength: 128 }
      examples:
        default: { value: "key_7f3c1a2b" }
    KeyCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque page token from the previous response's `next_cursor`
        (Control-issued). Absent means the first page; a malformed token is
        `400 invalid_request`, never a silently ignored boundary.
      schema: { type: string, maxLength: 512 }
    KeyOwnerFilter:
      name: owner_user_id
      in: query
      required: false
      description: |
        Restrict the list to one owner. Honored for `admin`/`owner`; a `member`
        may only name themselves (any other value is `403 forbidden`), and the
        filter is forced to the caller either way.
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    KeyOperationID:
      name: operation_id
      in: query
      required: false
      description: |
        Recovery mode: return the stored metadata of this key operation
        (`replayed: true`, never a secret). Unknown, foreign-organization or
        non-key operations answer `404 not_found`.
      schema: { type: string, minLength: 1, maxLength: 200 }
    UsageFrom:
      name: from
      in: query
      required: false
      description: |
        Inclusive lower bound on the event occurrence time, RFC 3339. Defaults to
        `to - 24h`.
      schema: { type: string, format: date-time }
      examples:
        default: { value: "2026-09-30T12:00:00Z" }
    UsageTo:
      name: to
      in: query
      required: false
      description: |
        Inclusive upper bound, RFC 3339. Defaults to now. `from` must be earlier
        than `to` and the range may not exceed 31 days.
      schema: { type: string, format: date-time }
      examples:
        default: { value: "2026-10-01T12:00:00Z" }
    UsageModel:
      name: model
      in: query
      required: false
      description: Exact model name filter (for example `gpt-4o`).
      schema: { type: string, maxLength: 128 }
    UsageUser:
      name: user
      in: query
      required: false
      description: |
        Exact user id filter. For a plain `member` this may only be the caller
        (anything else is `403 forbidden`); for `billing_viewer`/`admin`/`owner`
        any user id, or omit it for the whole organization.
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    UsageKey:
      name: key
      in: query
      required: false
      description: Exact API key id filter (`metering_events.key_id`).
      schema: { type: string, maxLength: 128 }
    UsageLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Defaults to 20; values above 100 are clamped to 100 and values
        below 1 are `400 invalid_request`. Totals are not affected by the page
        size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UsageCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from the previous response's `next_cursor`, carrying the
        last row's `(occurred_at, id)` pair. It is URL-safe and must be passed
        back verbatim; a malformed or non-canonical token is
        `400 invalid_request`.
      schema: { type: string }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        Session-bound CSRF token returned by login and by `GET /api/v1/me`.
        Missing or mismatching values produce `403 forbidden`.
      schema: { type: string, minLength: 1 }
    InvitationToken:
      name: token
      in: path
      required: true
      description: |
        Raw invitation token (43 URL-safe characters) returned exactly once by
        `POST /api/v1/orgs/{org}/invitations`. It is a credential: it is never
        logged and never stored in plaintext (only its SHA-256 is kept).
      schema: { type: string, minLength: 1 }
    BillingLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Defaults to 20; values above 100 are clamped to 100 and
        values below 1 are `400 invalid_request`.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PriceModelFilter:
      name: model
      in: query
      required: false
      description: Exact model name filter. Omit it to list every model's versions.
      schema: { type: string, maxLength: 128 }
    PriceCursor:
      name: cursor
      in: query
      required: false
      description: |
        Cursor from the previous response's `next_cursor`: the last price
        version id. Rows with a greater id are newer, so paging walks backwards
        through publication history. A malformed or negative value is
        `400 invalid_request`.
      schema: { type: string, pattern: '^[0-9]+$' }
    BillingEntriesCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from the previous response's `next_cursor`, carrying the
        last row's `(posted_at, id)` pair. Pass it back verbatim; a malformed or
        non-canonical token is `400 invalid_request`.
      schema: { type: string }
    BillingEntryKind:
      name: kind
      in: query
      required: false
      description: Restrict the page to one ledger movement type.
      schema:
        type: string
        enum: [credit, debit, adjustment, reservation, release]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated business id of one adjustment, 1..200 characters. It
        becomes the ledger's `business_id`; replaying it with the same payload
        returns the stored posting with `200 OK` and `replayed: true`, while a
        different payload under the same key is `409 conflict` and moves no
        money. A missing or over-long value is `400 invalid_request`.
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    InvalidRequest:
      description: Malformed body, invalid parameter or invalid enum value.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            default:
              value:
                error:
                  code: invalid_request
                  message: email and password are required
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
    Unauthorized:
      description: Missing, invalid, expired, revoked or tampered session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            default:
              value:
                error:
                  code: unauthorized
                  message: session is invalid or expired
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
    Forbidden:
      description: |
        Missing or mismatching CSRF token, a disabled user, a caller without
        platform-administrator privileges, or an organization member whose role
        is refused by the ADR-0003 §2.3 matrix (including granting `owner`
        outside the ownership-transfer endpoint, inviting an `admin` as an
        `admin`, or redeeming an invitation issued for a different email).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            default:
              value:
                error:
                  code: forbidden
                  message: missing or invalid CSRF token
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
            matrixViolation:
              summary: A member tries to invite (manage_members is admin/owner only)
              value:
                error:
                  code: forbidden
                  message: action is not permitted for your organization role
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
            ownerGrant:
              summary: Ownership can only be granted by the transfer endpoint
              value:
                error:
                  code: forbidden
                  message: owner may only be granted through ownership transfer
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
            invitationEmail:
              summary: The invitation was issued for a different email
              value:
                error:
                  code: forbidden
                  message: invitation was issued for a different email
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
    NotFound:
      description: |
        Unknown resource, or a resource the caller may not see: a non-member of
        an organization, a removed member, a member or invitation that does not
        exist, or an invitation token that does not exist (or was tampered
        with). Non-membership is always `404`, never `403`, so organization
        existence is not disclosed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            default:
              value:
                error:
                  code: not_found
                  message: organization not found
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
            memberNotFound:
              value:
                error:
                  code: not_found
                  message: member not found
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
            invitationNotFound:
              value:
                error:
                  code: not_found
                  message: invitation not found
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
    Conflict:
      description: |
        A uniqueness conflict (an email that is already registered) or a state
        conflict: the last remaining owner cannot leave or be demoted, and an
        invitation that was already accepted, revoked or expired cannot be
        redeemed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            default:
              value:
                error:
                  code: conflict
                  message: email is already registered
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
            lastOwner:
              summary: The organization must keep at least one owner
              value:
                error:
                  code: conflict
                  message: organization must keep at least one owner
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
            invitationNotPending:
              summary: The invitation is no longer redeemable
              value:
                error:
                  code: conflict
                  message: invitation was already accepted
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
    RateLimited:
      description: Login throttled for this email and client IP.
      headers:
        Retry-After:
          description: Seconds until a retry may succeed.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            default:
              value:
                error:
                  code: rate_limited
                  message: too many login attempts, retry later
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
    ServiceUnavailable:
      description: |
        `503 unavailable`. The Console has no control channel configured
        (`CONTROL_ADDR` is unset), so key management cannot be served at all.
        This is a deployment fact, not a per-request failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            noChannel:
              value:
                error:
                  code: unavailable
                  message: the control channel is not configured
                  request_id: req-01J8Z9
    UpstreamUnavailable:
      description: |
        `502 upstream_unavailable`. The Console could not authenticate to Control
        (UNAUTHENTICATED/PERMISSION_DENIED, for example a client certificate that
        is not `CONTROL_CONSOLE_SERVICE_NAME`) or could not reach it. The browser
        cannot fix either, so this is deliberately not a `401`/`403`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            controlDown:
              value:
                error:
                  code: upstream_unavailable
                  message: the control plane is unavailable
                  request_id: req-01J8Z9
    Internal:
      description: Unexpected server-side failure. Details are logged, never returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            default:
              value:
                error:
                  code: internal_error
                  message: internal error
                  request_id: 8f1c0b2e4d5a6f708192a3b4c5d6e7f8
  schemas:
    ErrorEnvelope:
      type: object
      description: The shared T01A error envelope used by every service in this repository.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable, machine-readable error code. The canonical vocabulary is
                `invalid_request`, `unauthorized`, `forbidden`, `not_found`,
                `conflict`, `method_not_allowed`, `rate_limited`,
                `insufficient_balance`, `config_pending`, `billing_unavailable`,
                `upstream_unavailable`, `unavailable` and `internal_error`.
                Console only emits the subset listed here.
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - method_not_allowed
                - rate_limited
                - upstream_unavailable
                - unavailable
                - internal_error
            message:
              type: string
              description: Human-readable explanation. Not a stable contract; never contains secrets.
            request_id:
              type: string
              description: |
                Correlation id, equal to the `X-Request-ID` response header.
                Empty when the request id could not be established.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          writeOnly: true

    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, organizations, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        csrf_token:
          type: string
          description: Session-bound CSRF token for `X-CSRF-Token`.

    MeResponse:
      type: object
      additionalProperties: false
      required: [user, organizations, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        csrf_token:
          type: string
          description: |
            The CSRF token bound to the current session, so a client that
            reloaded the page can resume unsafe requests. Empty string when the
            companion cookie is absent.

    User:
      type: object
      additionalProperties: false
      required: [id, email, status, platform_admin, created_at, updated_at]
      properties:
        id:
          type: string
          description: 64-bit user id as a decimal string.
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        platform_admin:
          type: boolean
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Organization:
      type: object
      additionalProperties: false
      required: [id, type, name, status, created_at]
      properties:
        id:
          type: string
          description: 64-bit organization id as a decimal string.
        type:
          type: string
          enum: [personal, enterprise]
        name: { type: string }
        status:
          type: string
          enum: [active, suspended]
        legacy_tenant_id:
          type: [string, "null"]
          description: |
            Optional mapping to a historical `metering_events.tenant_id`
            string. Present only for organizations adopted from the legacy
            tenant model; never fabricated for historical events.
        created_at: { type: string, format: date-time }

    Membership:
      type: object
      description: An organization together with the caller's role in it.
      additionalProperties: false
      required: [organization, role]
      properties:
        organization: { $ref: '#/components/schemas/Organization' }
        role:
          type: string
          enum: [owner, admin, member, billing_viewer]

    MembershipPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        next_cursor:
          type: [string, "null"]
          description: Last organization id of this page, or `null` on the last page.

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name; surrounding whitespace is trimmed.

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          writeOnly: true
        platform_admin:
          type: boolean
          default: false
        organizations:
          type: array
          description: |
            Organization ids (as strings) the new user is added to with the
            `member` role. Each one must be visible to the acting administrator.
          items: { type: string, pattern: '^[1-9][0-9]*$' }

    SetUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]
          description: |
            `disabled` bumps the user's `auth_version`, immediately invalidating
            every existing session of that user.

    Member:
      type: object
      description: One active member of an organization.
      additionalProperties: false
      required: [user_id, email, role, status, created_at]
      properties:
        user_id:
          type: string
          description: 64-bit user id as a decimal string.
        email: { type: string, format: email }
        role:
          type: string
          enum: [owner, admin, member, billing_viewer]
        status:
          type: string
          enum: [active]
          description: |
            Only active members are listed; removed members never appear (the
            field is part of the frozen shape for forward compatibility).
        created_at: { type: string, format: date-time }

    MemberPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        next_cursor:
          type: [string, "null"]
          description: Always `null` in this version (member lists are not paginated).

    Invitation:
      type: object
      description: |
        Invitation metadata. Never contains the token or its hash: the raw token
        is returned exactly once by the create call.
      additionalProperties: false
      required: [id, organization_id, email, role, status, expires_at, created_at]
      properties:
        id: { type: string, description: 64-bit invitation id as a decimal string. }
        organization_id: { type: string }
        email:
          type: string
          format: email
          description: Normalized (trimmed, lowercased) address the invitation is fixed to.
        role:
          type: string
          enum: [owner, admin, member, billing_viewer]
          description: Role the invitee receives; it cannot be overridden at acceptance.
        status:
          type: string
          enum: [pending, accepted, revoked]
        expires_at: { type: string, format: date-time }
        accepted_at:
          type: [string, "null"]
          format: date-time
        created_by:
          type: [string, "null"]
          description: User id of the creator, `null` after that user is deleted.
        created_at: { type: string, format: date-time }

    InvitationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        next_cursor:
          type: [string, "null"]
          description: Always `null`; at most the 200 most recent invitations are returned.

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: |
            Target address; it is normalized (trimmed, lowercased) and fixed.
            No email is sent and the address is not verified by delivery.
        role:
          type: string
          enum: [owner, admin, member, billing_viewer]
          description: |
            `member`/`billing_viewer` need `manage_members`; `admin` needs
            `create_admin` (owner); `owner` may only be invited by an owner.
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          description: |
            Optional lifetime. Defaults to 259200 (72h) when omitted or 0;
            clamped server-side to the documented range.

    CreateInvitationResponse:
      type: object
      additionalProperties: false
      required: [invitation, token]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        token:
          type: string
          description: |
            Raw single-use token. Appears exactly once, in this response; the
            server keeps only its SHA-256. Treat it as a credential.

    MembershipRecord:
      type: object
      description: A membership that was created or reactivated.
      additionalProperties: false
      required: [organization_id, user_id, role, status, created_at]
      properties:
        organization_id: { type: string }
        user_id: { type: string }
        role:
          type: string
          enum: [owner, admin, member, billing_viewer]
        status:
          type: string
          enum: [active, removed]
        created_at:
          type: string
          format: date-time
          description: First time the user joined the organization (unchanged on re-join).

    ChangeMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          description: |
            New role. `owner` is refused here (use the transfer endpoint) and
            `platform_admin` is refused outright (it is a user-level flag, not
            an organization role).
          enum: [owner, admin, member, billing_viewer]

    OwnerTransferRequest:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: User id (decimal string) of the new owner.

    OwnerTransferResponse:
      type: object
      additionalProperties: false
      required: [organization_id, owner_user_id, previous_owner_user_id, previous_owner_role]
      properties:
        organization_id: { type: string }
        owner_user_id: { type: string, description: The new owner's user id. }
        previous_owner_user_id: { type: string }
        previous_owner_role:
          type: string
          enum: [admin]
          description: The outgoing owner always becomes `admin`.

    ApiKey:
      type: object
      description: |
        Redacted projection of one `api_keys` row (ADR-0003 §2.1/§2.9). It never
        contains the key hash or the raw secret.
      additionalProperties: false
      required: [key_id, prefix, organization_id, owner_user_id, created_by, status, expires_at, revoked_at, model_allowlist, policy_version, created_at, tenant_id]
      properties:
        key_id:
          type: string
          description: Globally unique key id, used by the revoke endpoint.
        prefix:
          type: string
          description: Display prefix (`sk-xxxxxxxx...`); enough to recognise a key, useless to use it.
        organization_id:
          type: string
          description: Owning organization id (decimal string).
        owner_user_id:
          type: [string, "null"]
          description: |
            Owner user id, or `null` for a legacy/unknown owner. A `member` can
            only ever see their own keys, so `null` never appears in their view.
        created_by:
          type: [string, "null"]
          description: User id recorded as the creator of the key.
        status:
          type: string
          enum: [active, revoked]
        expires_at:
          type: [string, "null"]
          format: date-time
          description: "`null` means the key does not expire."
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: "`null` while the key is active."
        model_allowlist:
          type: [array, "null"]
          items: { type: string }
          description: |
            Tri-state model permission (ADR-0003 §2.7): `null` inherits the
            organization policy, `[]` is an explicit deny-all, and a non-empty
            array is an explicit allowlist. The three cases must stay
            distinguishable.
        policy_version:
          type: string
          description: Policy version the key was last written with (decimal string).
        created_at: { type: string, format: date-time }
        tenant_id:
          type: string
          description: |
            Legacy tenant projection the Gateway still resolves: the
            organization's `legacy_tenant_id` when mapped, otherwise `org:<id>`.

    ApiKeyPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, replayed]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiKey' }
        next_cursor:
          type: [string, "null"]
          description: Opaque Control page token, or `null` on the last page.
        replayed:
          type: boolean
          description: |
            `true` only for `?operation_id=...` recovery: the listed key is
            stored metadata of an already applied operation, so no secret exists
            for it any more. Always `false` for a normal list.

    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        owner_user_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: |
            Optional owner. A `member` may only name themselves (or omit it);
            `admin`/`owner` may name any active member of the organization.
            Omitted defaults to the caller.
        expires_at:
          type: string
          format: date-time
          description: Optional RFC 3339 expiry; must be in the future.
        model_allowlist:
          type: array
          items: { type: string }
          description: |
            Optional model allowlist. Absent or `null` inherits the organization
            policy; `[]` is an explicit deny-all. Values are trimmed,
            de-duplicated and sorted, and at most 256 models of 128 bytes each
            are accepted.
        operation_id:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Optional client-chosen idempotency key. Retrying the same create with
            the same value returns the stored metadata instead of creating a
            second key; reusing it with a different payload is `409 conflict`.

    CreateApiKeyResponse:
      type: object
      additionalProperties: false
      required: [key, secret_returned_once, replayed, resulting_version, notice]
      properties:
        key: { $ref: '#/components/schemas/ApiKey' }
        secret:
          type: string
          description: |
            The raw API key. Present **only** on a first, non-replayed create and
            omitted entirely on a replay: Control never stores it, so no later
            request, log or export can return it again. Treat it as a credential
            and store it in a secret manager.
        secret_returned_once:
          type: boolean
          description: "`true` when `secret` is present in this response, `false` on an idempotent replay."
        replayed:
          type: boolean
          description: "`true` when Control returned the stored result of an already applied operation."
        resulting_version:
          type: string
          description: Control snapshot version produced by this command (decimal string).
        notice:
          type: string
          description: Human-readable statement that the secret is shown once, or — on a replay — how to recover the metadata.

    RevokeApiKeyResponse:
      type: object
      additionalProperties: false
      required: [key, replayed, resulting_version]
      properties:
        key: { $ref: '#/components/schemas/ApiKey' }
        replayed:
          type: boolean
          description: "`true` when the revoke was an idempotent replay."
        resulting_version:
          type: string
          description: |
            Control snapshot version produced by this command (decimal string);
            unchanged when the key was already revoked.

    UsageEvent:
      type: object
      description: |
        One `metering_events` row. `id`/`occurred_at` are the event's stable
        `event_id` and its `created_at` occurrence time.
      additionalProperties: false
      required: [id, occurred_at, organization_id, user_id, key_id, execution_id, tenant_id, model, provider, prompt_tokens, completion_tokens, total_tokens, cost_cents, attribution]
      properties:
        id:
          type: string
          description: Stable event id (`metering_events.event_id`); the tiebreaker of the `(occurred_at, id)` order.
        occurred_at:
          type: string
          format: date-time
          description: Event occurrence time (`metering_events.created_at`), RFC 3339 UTC.
        organization_id:
          type: [string, "null"]
          description: |
            Attributed organization. In an organization scope this is always the
            requested organization; `null` rows (written before the attribution
            migration) are excluded from every organization scope.
        user_id:
          type: [string, "null"]
          description: |
            Attributed user, or `null` for an organization row whose user is
            unknown (legacy key). `null` rows are never visible to a `member`.
        key_id:
          type: [string, "null"]
          description: Attributed API key id, or `null` when unknown.
        execution_id:
          type: [string, "null"]
          description: Optional upstream execution correlation id.
        tenant_id:
          type: string
          description: Legacy tenant string the event was written with.
        model: { type: string }
        provider: { type: string }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cost_cents:
          type: string
          description: |
            Decimal string. Legacy demo consumption (1 token = 1 cent), not a
            balance and not an invoice amount.
        attribution:
          type: string
          enum: [attributed, legacy_unknown_user]
          description: "`legacy_unknown_user` marks an attributed organization row with an unknown user."

    UsageTotals:
      type: object
      description: |
        Totals of the **whole filtered window**, independent of `limit`/`cursor`.
      additionalProperties: false
      required: [events, prompt_tokens, completion_tokens, total_tokens, cost_cents, cost_kind, cost_note]
      properties:
        events: { type: integer, minimum: 0 }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cost_cents:
          type: string
          description: Decimal string; accumulated demo consumption, never a balance.
        cost_kind:
          type: string
          enum: [demo_consumption]
          description: Label of the legacy price model behind `cost_cents`.
        cost_note:
          type: string
          description: Human-readable reminder that this is demo consumption, not a balance or an invoice.

    UsageWindow:
      type: object
      description: The window the server actually applied, after defaults.
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    UsagePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, totals, window, scope]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UsageEvent' }
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page, or `null` on the last page.
        totals: { $ref: '#/components/schemas/UsageTotals' }
        window: { $ref: '#/components/schemas/UsageWindow' }
        scope:
          type: string
          enum: [self, organization]
          description: The scope the server applied to this response.

    AuditEvent:
      type: object
      description: |
        One console_audit_events row. It never contains passwords, session or
        CSRF tokens, or invitation tokens.
      additionalProperties: false
      required: [id, action, target_type, target_id, outcome, detail, created_at]
      properties:
        id: { type: string }
        actor_user_id:
          type: [string, "null"]
          description: "`null` for actions without an authenticated actor."
        actor_organization_id:
          type: [string, "null"]
          description: |
            Organization the action was performed in (for refused cross-org
            probes: the organization that was targeted). `null` when there is no
            organization context, e.g. accepting an unknown invitation token.
        action:
          type: string
          enum:
            - org.invitation.create
            - org.invitation.accept
            - org.member.role_change
            - org.member.remove
            - org.owner.transfer
            - org.key.create
            - org.key.revoke
            - admin.user.create
            - admin.user.status
            - admin.price.create
            - billing.adjustment
        target_type:
          type: string
          enum: [membership, invitation, user, api_key, price_version, billing_account]
        target_id:
          type: string
          description: Target id as a decimal string; empty when unknown (never the token).
        outcome:
          type: string
          enum: [success, failure]
        detail:
          type: [object, "null"]
          description: |
            Action-specific, non-secret metadata (role, email, expiry, or the
            failure reason). Passed through verbatim.
          additionalProperties: true
        request_id: { type: [string, "null"] }
        trace_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        next_cursor:
          type: [string, "null"]
          description: Last audit id of this page, or `null` on the last page.

    PriceVersion:
      type: object
      description: |
        One immutable price version: the prices of `model` from `effective_at`
        onwards. Publishing a price inserts a row; the database refuses UPDATE
        and DELETE on this table, so a past request can always be re-priced with
        the version it was admitted under.
      additionalProperties: false
      required:
        - id
        - model
        - currency
        - input_price_micro_per_million
        - output_price_micro_per_million
        - provider_input_cost_micro_per_million
        - provider_output_cost_micro_per_million
        - effective_at
        - created_by
        - created_at
      properties:
        id: { type: string, description: 64-bit id as a decimal string. }
        model: { type: string }
        currency: { type: string, enum: [CNY] }
        input_price_micro_per_million:
          type: string
          description: Micro-yuan per one million input tokens, as a decimal string.
        output_price_micro_per_million:
          type: string
          description: Micro-yuan per one million output tokens, as a decimal string.
        provider_input_cost_micro_per_million:
          type: [string, "null"]
          description: |
            What the platform pays per one million input tokens. `null` means
            unknown; it is never rendered as `0`.
        provider_output_cost_micro_per_million:
          type: [string, "null"]
          description: Same as above for output tokens.
        effective_at:
          type: string
          format: date-time
          description: |
            Instant this version takes effect. Together with `model` it is the
            version's identity, so the pair is unique.
        created_by:
          type: [string, "null"]
          description: Platform administrator who published it; `null` when the account was deleted.
        created_at: { type: string, format: date-time }

    PriceVersionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PriceVersion' }
        next_cursor:
          type: [string, "null"]
          description: Last price version id of this page, or `null` on the last page.

    CreatePriceVersionRequest:
      type: object
      additionalProperties: false
      required:
        - model
        - input_price_micro_per_million
        - output_price_micro_per_million
        - effective_at
      properties:
        model: { type: string, minLength: 1, maxLength: 128 }
        currency:
          type: string
          enum: [CNY]
          default: CNY
          description: Only `CNY` exists in this version; anything else is `400 invalid_request`.
        input_price_micro_per_million:
          type: string
          pattern: '^[0-9]+$'
          description: Non-negative decimal string of micro-yuan per one million input tokens.
        output_price_micro_per_million:
          type: string
          pattern: '^[0-9]+$'
        provider_input_cost_micro_per_million:
          type: [string, "null"]
          pattern: '^[0-9]+$'
          description: Optional; omit or send `null` when the cost is unknown.
        provider_output_cost_micro_per_million:
          type: [string, "null"]
          pattern: '^[0-9]+$'
        effective_at:
          type: string
          format: date-time
          description: RFC 3339 instant; must not collide with an existing version of the same model.

    BillingAccount:
      type: object
      description: |
        The organization's billing projection. It is derived from the ledger and
        can always be recomputed from it; the ledger, not this row, is the fact.
      additionalProperties: false
      required:
        - organization_id
        - currency
        - posted_balance_micro
        - reserved_micro
        - available_micro
        - status
        - version
        - created_at
        - updated_at
        - available_note
      properties:
        organization_id: { type: string }
        currency: { type: string, enum: [CNY] }
        posted_balance_micro:
          type: string
          description: |
            Sum of every posted entry. May be negative: an explicit debt that
            the admission path refuses to spend from.
        reserved_micro:
          type: string
          description: Funds held by in-flight executions (T06). Never negative.
        available_micro:
          type: string
          description: "`posted_balance_micro - reserved_micro`."
        status: { type: string, enum: [active, suspended] }
        version:
          type: string
          description: Monotonic projection version, incremented on every posting.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        available_note:
          type: string
          description: Frozen wording of the available-funds invariant, so a UI cannot present the posted balance as spendable money.

    BillingEntry:
      type: object
      description: |
        One append-only ledger row. Corrections are new reversing entries, never
        edits; the table rejects UPDATE and DELETE.
      additionalProperties: false
      required:
        - id
        - organization_id
        - kind
        - direction
        - amount_micro
        - business_id
        - reason
        - operator_user_id
        - request_id
        - posted_at
        - created_at
      properties:
        id: { type: string }
        organization_id: { type: string }
        kind:
          type: string
          enum: [credit, debit, adjustment, reservation, release]
          description: |
            `credit`/`debit`/`adjustment` move the posted balance;
            `reservation`/`release` move the reserved bucket (T06).
        direction:
          type: string
          enum: [credit, debit]
          description: The only sign in the ledger; `amount_micro` is always positive.
        amount_micro: { type: string, description: Strictly positive decimal string of micro-yuan. }
        business_id:
          type: string
          description: Business identity of the posting; `(business_id, kind)` is unique, which is what makes a retry a replay.
        reason: { type: [string, "null"] }
        operator_user_id:
          type: [string, "null"]
          description: "`null` for a posting the platform made without an operator."
        request_id: { type: [string, "null"] }
        posted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    BillingEntryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BillingEntry' }
        next_cursor:
          type: [string, "null"]
          description: Opaque `(posted_at, id)` cursor, or `null` on the last page.

    AdjustmentRequest:
      type: object
      additionalProperties: false
      required: [amount_micro, direction, reason]
      properties:
        amount_micro:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Strictly positive decimal string of micro-yuan. A JSON number is `400 invalid_request`.
        direction: { type: string, enum: [credit, debit] }
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: Mandatory human reason, stored on the entry and in its audit row.

    AdjustmentResponse:
      type: object
      additionalProperties: false
      required: [entry, account, replayed]
      properties:
        entry: { $ref: '#/components/schemas/BillingEntry' }
        account: { $ref: '#/components/schemas/BillingAccount' }
        replayed:
          type: boolean
          description: |
            `false` when this call applied the posting (`201 Created`), `true`
            when the same `Idempotency-Key` and payload had already been applied
            (`200 OK`).

security:
