openapi: 3.1.0
info:
  title: LLM Gateway Console API
  version: "1.0.0"
  description: |
    Browser-facing management API under /api/v1. The data-plane API (/v1) is
    separate. Registration creates a personal account. Enterprise accounts are
    created by a platform operator or by redeeming an activation code.
    Membership roles are owner, admin, and member; platform_admin is a user
    permission and is not an organization role.

    All unsafe requests require the session-bound X-CSRF-Token header. The
    session cookie is HttpOnly. Money and 64-bit identifiers are JSON decimal
    strings. Month-based business usage follows Asia/Shanghai admission month;
    ledger statements follow Asia/Shanghai posted_at month. A pending usage row
    has charge_micro=null, never a fabricated zero. Unknown provider cost is
    reported separately and is not represented as zero.
servers:
  - url: http://127.0.0.1:8092
security:
  - sessionCookie: []
tags:
  - name: session
  - name: accounts
  - name: members
  - name: keys
  - name: usage
  - name: billing
  - name: platform
paths:
  /api/v1/auth/login:
    post:
      tags: [session]
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { description: Session created, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/register:
    post:
      tags: [session]
      security: []
      summary: Create a personal account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { description: Account and session created, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [session]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: Session revoked }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      tags: [session]
      responses:
        '200': { description: Current user and accessible accounts, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/me/password:
    post:
      tags: [session]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed; all sessions are invalidated }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/organizations:
    get:
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Accounts available to the current user, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/organizations/{org}:
    get:
      tags: [accounts]
      parameters: [{ $ref: '#/components/parameters/Org' }]
      responses:
        '200': { description: Account membership, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/organizations/activate:
    post:
      tags: [accounts]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        '201': { description: Enterprise membership created, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/me/join-requests:
    get:
      tags: [accounts]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Join requests submitted by the current user, content: { application/json: { schema: { $ref: '#/components/schemas/JoinRequestList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/join-requests:
    get:
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, cancelled] }
          description: Filter by request state; pending is used by the approval queue.
      responses:
        '200': { description: Requests awaiting or with a decision, content: { application/json: { schema: { $ref: '#/components/schemas/JoinRequestList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [accounts]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties: { display_name: { type: string } }
      responses:
        '201': { description: Join request submitted, content: { application/json: { schema: { $ref: '#/components/schemas/JoinRequest' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/join-requests/{request}/decision:
    post:
      tags: [accounts]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/JoinRequestId' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
                monthly_limit_micro: { $ref: '#/components/schemas/NullableMoney', description: Required when approving; null means unlimited. }
              allOf:
                - if: { properties: { status: { const: approved } } }
                  then: { required: [monthly_limit_micro] }
      responses:
        '200': { description: Join request decision saved, content: { application/json: { schema: { $ref: '#/components/schemas/JoinRequest' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/models:
    get:
      tags: [accounts]
      parameters: [{ $ref: '#/components/parameters/Org' }]
      responses:
        '200': { description: Models available in this account, including its sales prices, content: { application/json: { schema: { $ref: '#/components/schemas/AccountModels' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/members:
    get:
      tags: [members]
      parameters: [{ $ref: '#/components/parameters/Org' }]
      responses:
        '200': { description: Members and their account roles, content: { application/json: { schema: { $ref: '#/components/schemas/MemberList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/members/{user}:
    patch:
      tags: [members]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [member, admin] }
                status: { type: string, enum: [active, suspended] }
                monthly_limit_micro: { $ref: '#/components/schemas/NullableMoney' }
              allOf:
                - if: { required: [role], properties: { role: { const: member } } }
                  then: { required: [monthly_limit_micro] }
      responses:
        '204': { description: Member updated }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [members]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: Member removed }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/members/{user}/quota:
    patch:
      tags: [members]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthly_limit_micro]
              properties: { monthly_limit_micro: { $ref: '#/components/schemas/NullableMoney' } }
      responses:
        '204': { description: Monthly limit updated }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/invitations:
    get:
      tags: [members]
      parameters: [{ $ref: '#/components/parameters/Org' }]
      responses:
        '200': { description: Invitations, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [members]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [member, admin] }
                monthly_limit_micro: { $ref: '#/components/schemas/NullableMoney', description: Required for member invites; null means unlimited. }
                expires_in_seconds: { type: integer, minimum: 60, maximum: 2592000 }
              allOf:
                - if: { properties: { role: { const: member } } }
                  then: { required: [monthly_limit_micro] }
      responses:
        '201': { description: Invitation created; the raw token is returned once, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationCreated' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/invitations/{token}/accept:
    post:
      tags: [members]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '200': { description: Invitation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipRecord' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/owner-transfer:
    post:
      tags: [members]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user], properties: { user: { type: string } } }
      responses:
        '200': { description: Ownership transferred, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerTransferResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/keys:
    get:
      tags: [keys]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: operation_id, in: query, schema: { type: string } }
      responses:
        '200': { description: The signed-in user's keys only, content: { application/json: { schema: { $ref: '#/components/schemas/KeyList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [keys]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                expires_at: { type: string, format: date-time }
                model_allowlist: { type: array, items: { type: string } }
                operation_id: { type: string }
      responses:
        '201': { description: Key created; secret is returned once, content: { application/json: { schema: { $ref: '#/components/schemas/KeyCreated' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/keys/{key_id}/revoke:
    post:
      tags: [keys]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/KeyId' }, { $ref: '#/components/parameters/CSRF' }]
      responses:
        '200': { description: Key revoked, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeKeyResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/usage:
    get:
      tags: [usage]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: month, in: query, description: Asia/Shanghai admission month (YYYY-MM), schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: user, in: query, description: Platform/org admin may request their own id to view only their own usage and key ids, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Usage is grouped by execution admission month; organization scope contains no Key identifiers, content: { application/json: { schema: { $ref: '#/components/schemas/UsagePage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/quota:
    get:
      tags: [usage]
      parameters: [{ $ref: '#/components/parameters/Org' }]
      responses:
        '200': { description: Current user's monthly limit and usage, content: { application/json: { schema: { $ref: '#/components/schemas/Quota' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/billing/member-summary:
    get:
      tags: [usage]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Member totals without key identifiers or upstream cost, content: { application/json: { schema: { $ref: '#/components/schemas/MemberUsageSummary' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/audit:
    get:
      tags: [members]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Account audit events, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/billing/account:
    get:
      tags: [billing]
      parameters: [{ $ref: '#/components/parameters/Org' }]
      responses:
        '200': { description: Wallet projection, content: { application/json: { schema: { $ref: '#/components/schemas/BillingAccount' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/billing/entries:
    get:
      tags: [billing]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: kind, in: query, schema: { type: string, enum: [credit, debit, adjustment, reservation, release] } }
      responses:
        '200': { description: Append-only wallet ledger page, content: { application/json: { schema: { $ref: '#/components/schemas/BillingEntryPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/billing/statements:
    get:
      tags: [billing]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: month, in: query, description: Asia/Shanghai posted_at month (YYYY-MM); defaults to current month, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Monthly wallet statement grouped by posted_at, content: { application/json: { schema: { $ref: '#/components/schemas/BillingStatement' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/billing/exceptions:
    get:
      tags: [billing]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed] } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: execution, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Exceptions requiring financial review, content: { application/json: { schema: { $ref: '#/components/schemas/BillingExceptionPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orgs/{org}/billing/exceptions/{exception}:
    get:
      tags: [billing]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/ExceptionId' }]
      responses:
        '200': { description: Exception and its history, content: { application/json: { schema: { $ref: '#/components/schemas/BillingExceptionDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/organizations:
    get:
      tags: [platform]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [personal, enterprise] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Platform account list, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformOrganizationList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_email]
              properties: { name: { type: string }, owner_email: { type: string, format: email } }
      responses:
        '201': { description: Enterprise account created, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/organizations/{org}/status:
    post:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, suspended] } } }
      responses:
        '200': { description: Account status changed, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformOrganization' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/activation-codes:
    get:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Activation-code records, plaintext codes are not included, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationCodeList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enterprise_name]
              properties: { enterprise_name: { type: string }, expires_at: { type: string, format: date-time } }
      responses:
        '201': { description: Plaintext activation code is returned only once, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationCodeCreated' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/organizations/{org}/models:
    get:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/Org' }]
      responses:
        '200': { description: Account model allowlist and effective sales prices, content: { application/json: { schema: { $ref: '#/components/schemas/AccountModelSettings' } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [model_allowlist], properties: { model_allowlist: { oneOf: [{ type: array, items: { type: string } }, { type: 'null' }] } } }
      responses:
        '200': { description: Account model access updated, content: { application/json: { schema: { $ref: '#/components/schemas/AccountModelSettings' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/models:
    get:
      tags: [platform]
      responses:
        '200': { description: Platform model catalog, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformModelCatalog' } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, required: [model, enabled], properties: { model: { type: string }, enabled: { type: boolean } } } } } }
      responses:
        '200': { description: Platform catalog updated, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformModelCatalog' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/providers:
    get:
      tags: [platform]
      responses:
        '200': { description: Provider configuration and version, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Provider' }
      responses:
        '201': { description: Provider created, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderChanged' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/providers/{provider_id}:
    put:
      tags: [platform]
      description: The provider id in the body must match the path id.
      parameters: [{ $ref: '#/components/parameters/ProviderId' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Provider' }
      responses:
        '200': { description: Provider updated, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderChanged' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/ProviderId' }, { $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: Provider removed }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/provider-credentials:
    get:
      tags: [platform]
      responses:
        '200': { description: Redacted credential metadata only, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [provider_id, secret], properties: { provider_id: { type: string }, secret: { type: string, format: password } } }
      responses:
        '201': { description: Secret is never returned; metadata only, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialCreated' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/provider-credentials/{credential_id}:
    delete:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/CredentialId' }, { $ref: '#/components/parameters/CSRF' }]
      responses:
        '204': { description: Credential revoked }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/routes:
    get:
      tags: [platform]
      responses:
        '200': { description: Model routes and configuration version, content: { application/json: { schema: { $ref: '#/components/schemas/Routes' } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [platform]
      description: Replaces the complete model route map; expected_version prevents overwriting a newer edit.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [routes, expected_version], properties: { routes: { $ref: '#/components/schemas/RouteMap' }, expected_version: { type: integer, minimum: 0 } } }
      responses:
        '200': { description: Full route set replaced, content: { application/json: { schema: { $ref: '#/components/schemas/Routes' } } } }
        '409': { description: Configuration version changed; reload before saving }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/prices:
    get:
      tags: [platform]
      parameters:
        - { name: model, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Published model price versions, content: { application/json: { schema: { $ref: '#/components/schemas/PriceList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceInput' }
      responses:
        '201': { description: Price version published, content: { application/json: { schema: { $ref: '#/components/schemas/Price' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/summary:
    get:
      tags: [billing]
      parameters: [{ name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      responses:
        '200': { description: Platform sales, known-cost subtotal and unknown-cost count; released work is included in platform usage/cost counts, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformBillingSummary' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/accounts/{org}:
    get:
      tags: [billing]
      description: Platform administrator account inspection; does not require organization membership.
      parameters: [{ $ref: '#/components/parameters/Org' }]
      responses:
        '200': { description: Same wallet projection returned by the organization account route, content: { application/json: { schema: { $ref: '#/components/schemas/BillingAccount' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/accounts/{org}/entries:
    get:
      tags: [billing]
      description: Platform administrator ledger inspection; supports the same cursor filters as the organization route.
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: kind, in: query, schema: { type: string, enum: [credit, debit, adjustment, reservation, release] } }
      responses:
        '200': { description: Same ledger page as the organization route, content: { application/json: { schema: { $ref: '#/components/schemas/BillingEntryPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/accounts/{org}/exceptions:
    get:
      tags: [billing]
      description: Platform administrator exception inspection; supports the same filters as the organization route.
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed] } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: execution, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Same exception page as the organization route, content: { application/json: { schema: { $ref: '#/components/schemas/BillingExceptionPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/accounts/{org}/exceptions/{exception}:
    get:
      tags: [billing]
      description: Platform administrator exception detail scoped to the requested account.
      parameters: [{ $ref: '#/components/parameters/Org' }, { $ref: '#/components/parameters/ExceptionId' }]
      responses:
        '200': { description: Same exception detail as the organization route, content: { application/json: { schema: { $ref: '#/components/schemas/BillingExceptionDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/accounts/{org}/adjustments:
    post:
      tags: [billing]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { $ref: '#/components/parameters/CSRF' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentInput' }
      responses:
        '201': { description: Recharge or full reversal recorded, content: { application/json: { schema: { $ref: '#/components/schemas/AdjustmentResponse' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/AdjustmentResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/exceptions/{exception}/resolution:
    post:
      tags: [billing]
      parameters: [{ $ref: '#/components/parameters/ExceptionId' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveExceptionInput' }
      responses:
        '201': { description: Resolution recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ResolveExceptionResponse' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/ResolveExceptionResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/review-required:
    get:
      tags: [billing]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor_updated_at, in: query, schema: { type: string, format: date-time } }
        - { name: cursor_execution_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Requests needing operator review, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewQueue' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/billing/review-required/{execution}/{action}:
    post:
      tags: [billing]
      parameters:
        - { name: execution, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [release, settle] } }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: Reviewed request disposition, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewDisposition' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/users:
    post:
      tags: [platform]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, format: password }, platform_admin: { type: boolean } } }
      responses:
        '201': { description: User created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/users/{user_id}/status:
    post:
      tags: [platform]
      parameters: [{ name: user_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, disabled] } } }
      responses:
        '200': { description: User status changed, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gw_session
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Org:
      name: org
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: user
      in: path
      required: true
      schema: { type: string }
    JoinRequestId:
      name: request
      in: path
      required: true
      schema: { type: string }
    KeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string }
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema: { type: string }
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema: { type: string }
    ExceptionId:
      name: exception
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    BillingAccount:
      type: object
      required: [organization_id, currency, posted_balance_micro, reserved_micro, available_micro, status, version, created_at, updated_at, available_note]
      properties:
        organization_id: { type: string }
        currency: { type: string, enum: [CNY] }
        posted_balance_micro: { type: string }
        reserved_micro: { type: string }
        available_micro: { type: string }
        status: { type: string, enum: [active, suspended] }
        version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        available_note: { type: string }
    BillingEntry:
      type: object
      required: [id, organization_id, kind, direction, amount_micro, business_id, reason, operator_user_id, request_id, posted_at, created_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        kind: { type: string, enum: [credit, debit, adjustment, reservation, release] }
        direction: { type: string, enum: [credit, debit] }
        amount_micro: { type: string }
        business_id: { type: string }
        reason: { type: [string, 'null'] }
        operator_user_id: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        manual_operation: { type: [string, 'null'], enum: [recharge, reversal, null] }
        payment_reference: { type: [string, 'null'] }
        reversal_of_entry_id: { type: [string, 'null'] }
        posted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    BillingEntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BillingEntry' } }
        next_cursor: { type: [string, 'null'] }
    BillingException:
      type: object
      required: [id, kind, organization_id, execution_id, amount_micro, currency, reason, status, detected_at, last_seen_at, occurrences, resolved_at, resolved_by, resolution, resolution_note, version, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [usage_missing, usage_invalid, over_reserved, payload_conflict, unknown_upstream_cost, execution_ledger_mismatch, receipt_state_mismatch, entry_state_mismatch, account_projection_mismatch] }
        organization_id: { type: string }
        execution_id: { type: [string, 'null'] }
        amount_micro: { type: string }
        currency: { type: string, enum: [CNY] }
        reason: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        detected_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        occurrences: { type: string }
        resolved_at: { type: [string, 'null'], format: date-time }
        resolved_by: { type: [string, 'null'] }
        resolution: { type: [string, 'null'], enum: [charged, waived, dismissed, reopened, null] }
        resolution_note: { type: [string, 'null'] }
        version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BillingExceptionPage:
      type: object
      required: [items, next_cursor, totals, note]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BillingException' } }
        next_cursor: { type: [string, 'null'] }
        totals:
          type: object
          required: [open, resolved, dismissed, oldest_open_at, oldest_open_age_seconds]
          properties:
            open: { type: string }
            resolved: { type: string }
            dismissed: { type: string }
            oldest_open_at: { type: [string, 'null'], format: date-time }
            oldest_open_age_seconds: { type: [string, 'null'] }
        note: { type: string }
    BillingExceptionDetail:
      type: object
      required: [exception, events, note]
      properties:
        exception: { $ref: '#/components/schemas/BillingException' }
        events:
          type: array
          items:
            type: object
            required: [id, action, from_status, to_status, actor_user_id, note, created_at]
            properties:
              id: { type: string }
              action: { type: string, enum: [detected, recurred, resolved, dismissed, reopened] }
              from_status: { type: [string, 'null'], enum: [open, resolved, dismissed, null] }
              to_status: { type: [string, 'null'], enum: [open, resolved, dismissed, null] }
              actor_user_id: { type: [string, 'null'] }
              note: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }
        note: { type: string }
    BillingStatement:
      type: object
      required: [organization_id, month, currency, timezone, basis, cutoff_at, generated_at, window, totals, items, next_cursor, disclaimer, axis_note]
      properties:
        organization_id: { type: string }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        currency: { type: string, enum: [CNY] }
        timezone: { type: string, enum: [Asia/Shanghai] }
        basis: { type: string, enum: [posted_at] }
        cutoff_at: { type: string, format: date-time }
        generated_at: { type: string, format: date-time }
        window:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        totals:
          type: object
          required: [entries, credit_micro, debit_micro, net_micro, reserved_micro, released_micro, reserved_net_micro, late_entries, late_micro]
          properties:
            entries: { type: string }
            credit_micro: { type: string }
            debit_micro: { type: string }
            net_micro: { type: string }
            reserved_micro: { type: string }
            released_micro: { type: string }
            reserved_net_micro: { type: string }
            late_entries: { type: string }
            late_micro: { type: string }
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/BillingEntry' }
              - type: object
                required: [occurred_at, late_posted, late_days]
                properties:
                  occurred_at: { type: [string, 'null'], format: date-time }
                  late_posted: { type: boolean }
                  late_days: { type: integer }
        next_cursor: { type: [string, 'null'] }
        disclaimer: { type: string }
        axis_note: { type: string }
    AdjustmentResponse:
      type: object
      required: [entry, account, replayed]
      properties:
        entry: { $ref: '#/components/schemas/BillingEntry' }
        account: { $ref: '#/components/schemas/BillingAccount' }
        replayed: { type: boolean }
    ResolveExceptionResponse:
      type: object
      required: [exception, event, replayed]
      properties:
        exception: { $ref: '#/components/schemas/BillingException' }
        event:
          type: object
          required: [id, action, from_status, to_status, actor_user_id, note, created_at]
          properties:
            id: { type: string }
            action: { type: string, enum: [detected, recurred, resolved, dismissed, reopened] }
            from_status: { type: [string, 'null'], enum: [open, resolved, dismissed, null] }
            to_status: { type: [string, 'null'], enum: [open, resolved, dismissed, null] }
            actor_user_id: { type: [string, 'null'] }
            note: { type: [string, 'null'] }
            created_at: { type: string, format: date-time }
        replayed: { type: boolean }
    ReviewQueue:
      type: object
      required: [items, next_cursor, now, totals, min_age_seconds, sla_seconds]
      properties:
        items:
          type: array
          items:
            type: object
            required: [execution_id, organization_id, model, reserved_micro, updated_at, age_seconds, sla_breached, reason]
            properties:
              execution_id: { type: string }
              organization_id: { type: string }
              model: { type: string }
              reserved_micro: { type: string }
              updated_at: { type: string, format: date-time }
              age_seconds: { type: integer }
              sla_breached: { type: boolean }
              reason: { type: [string, 'null'] }
        next_cursor:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [updated_at, execution_id]
              properties:
                updated_at: { type: string, format: date-time }
                execution_id: { type: string }
        now: { type: string, format: date-time }
        totals:
          type: object
          required: [open, sla_breaches, oldest_age_seconds]
          properties:
            open: { type: string }
            sla_breaches: { type: string }
            oldest_age_seconds: { type: integer }
        min_age_seconds: { type: integer }
        sla_seconds: { type: integer }
    ReviewDisposition:
      type: object
      required: [execution_id, organization_id, status, action, charge_micro, policy, account, debit_entry, release_entry, request_id]
      properties:
        execution_id: { type: string }
        organization_id: { type: string }
        status: { type: string }
        action: { type: string, enum: [release, settle] }
        charge_micro: { type: string }
        policy: { type: string }
        account: { $ref: '#/components/schemas/BillingAccount' }
        debit_entry: { oneOf: [{ $ref: '#/components/schemas/BillingEntry' }, { type: 'null' }] }
        release_entry: { oneOf: [{ $ref: '#/components/schemas/BillingEntry' }, { type: 'null' }] }
        request_id: { type: string }
    RevokeKeyResponse:
      type: object
      required: [key, replayed, resulting_version]
      properties:
        key: { $ref: '#/components/schemas/ApiKey' }
        replayed: { type: boolean }
        resulting_version: { type: string }
    OwnerTransferResponse:
      type: object
      required: [organization_id, owner_user_id, previous_owner_user_id, previous_owner_role]
      properties:
        organization_id: { type: string }
        owner_user_id: { type: string }
        previous_owner_user_id: { type: string }
        previous_owner_role: { type: string, enum: [admin] }
    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, actor_user_id, actor_organization_id, action, target_type, target_id, outcome, detail, request_id, trace_id, created_at]
            properties:
              id: { type: string }
              actor_user_id: { type: [string, 'null'] }
              actor_organization_id: { type: [string, 'null'] }
              action: { type: string }
              target_type: { type: string, enum: [membership, invitation, user, api_key, price_version, billing_account] }
              target_id: { type: string }
              outcome: { type: string, enum: [success, failure] }
              detail: { type: [object, 'null'], additionalProperties: true }
              request_id: { type: [string, 'null'] }
              trace_id: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }
        next_cursor: { type: [string, 'null'] }
    ApiKey:
      type: object
      required: [key_id, name, prefix, organization_id, owner_user_id, created_by, status, expires_at, revoked_at, model_allowlist, policy_version, created_at, tenant_id]
      properties:
        key_id: { type: string }
        name: { type: string, description: Visible only to its owner }
        prefix: { type: string }
        organization_id: { type: string }
        owner_user_id: { type: [string, 'null'] }
        created_by: { type: [string, 'null'] }
        status: { type: string, enum: [active, revoked] }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        model_allowlist:
          oneOf: [{ type: array, items: { type: string } }, { type: 'null' }]
        policy_version: { type: string }
        created_at: { type: string, format: date-time }
        tenant_id: { type: string }
    NullableMoney:
      oneOf:
        - { type: string, pattern: '^(0|[1-9]\d*)$' }
        - { type: 'null' }
      description: Integer micro-yuan as a decimal string; null means unlimited.
    NullableMicroAmount:
      oneOf:
        - { type: string, pattern: '^(0|[1-9]\d*)$' }
        - { type: 'null' }
      description: Integer micro-yuan amount as a decimal string; null means not yet settled or unavailable, not zero.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    User:
      type: object
      required: [id, email, status, platform_admin, created_at, updated_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, disabled] }
        platform_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, type, name, status, legacy_tenant_id, created_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [personal, enterprise] }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        legacy_tenant_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Membership:
      type: object
      required: [organization, membership_id, role, status, monthly_limit_micro]
      properties:
        organization: { $ref: '#/components/schemas/Organization' }
        membership_id: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [active, suspended] }
        monthly_limit_micro: { $ref: '#/components/schemas/NullableMoney' }
    Session:
      type: object
      required: [user, organizations, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        csrf_token: { type: string }
    MembershipList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        next_cursor: { type: [string, 'null'] }
    PlatformOrganization:
      allOf:
        - { $ref: '#/components/schemas/Organization' }
        - type: object
          required: [owner_user_id, owner_email, model_allowlist]
          properties:
            owner_user_id: { type: string }
            owner_email: { type: string, format: email }
            model_allowlist:
              oneOf: [{ type: array, items: { type: string } }, { type: 'null' }]
    PlatformOrganizationList:
      type: object
      required: [items, next_cursor]
      properties:
